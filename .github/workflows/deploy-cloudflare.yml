name: Deploy Cloudflare

# The demo runs on Cloudflare Workers. (The marketing site, munaxa.com, is not part of this
# repository: it deploys from munaxa/munaxa to the `munaxa` Worker.)
#
# Apps here used to deploy via Cloudflare's dashboard "Workers Builds", whose settings (build watch
# paths, build/deploy commands, root directory) live outside this repository. That is how the
# live sites went stale without anything going red: a merge that only touched the design system did
# not match a project's watch paths, so no build ran and the Worker kept serving its previous
# bundle — green `main`, nothing in the dashboard, stale site.
#
# Deployment now lives here instead. Every merge to `main` requests a production deploy of every
# app below, unconditionally and with no path filtering: the apps render their UI from
# `@munaxa/ui`, so "nothing they consume changed" is not a judgement a path filter can make
# correctly. A redundant deploy costs one short build; a skipped one costs a silently stale
# production site.
#
# A request is not a deploy. The `production-gate` job first proves, from the GitHub API, that the
# `production` environment requires a reviewer's approval (and that admins cannot bypass it, and
# only `main` may deploy); if it does not, the run fails before anything is built and nothing is
# deployed. If it does, the deploy job waits in Actions until a reviewer approves it. See
# docs/ops/deployment-gates.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same app race. Do not cancel in progress: a half-finished
# `wrangler deploy` that loses to a newer run is worse than waiting.
concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  production-gate:
    name: Production gate · approval required
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Require a protected production environment
        run: node scripts/deploy-gate.mjs verify-environment "$TARGET"
        env:
          TARGET: production
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy ${{ matrix.app }} → ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: production-gate
    environment: production
    # Installing needs to pull @munaxa/* from GitHub Packages; the workflow-level
    # contents:read default cannot download a private package.
    permissions:
      contents: read
      packages: read
    strategy:
      # One app failing must not stop the others from reaching production.
      fail-fast: false
      matrix:
        include:
          # `worker` is the Cloudflare Worker each app deploys to, asserted against the app's
          # own wrangler config below. Never `munaxa`: that Worker serves munaxa.com from
          # munaxa/munaxa, and two repositories deploying to one Worker overwrite each other.
          - app: demo
            filter: munaxademo
            config: munaxademo/wrangler.jsonc
            worker: munaxademo
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      # A `name` that does not match the real Worker does not fail the deploy — wrangler just
      # creates a new Worker that no custom domain points at, and the live site never changes.
      # Catch that here, before it becomes another silent stale deploy.
      - name: Assert the config targets the expected Worker
        run: |
          actual=$(grep -oP '^\s*"name":\s*"\K[^"]+' '${{ matrix.config }}' | head -1)
          if [ "$actual" != '${{ matrix.worker }}' ]; then
            echo "::error file=${{ matrix.config }}::Worker name is \"$actual\" but this app deploys to \"${{ matrix.worker }}\". Deploying would create a Worker with no custom domain and leave the live site stale."
            exit 1
          fi
          echo "$actual ✓"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each app's `cf:deploy` builds its shared dependencies, runs its adapter, then invokes
      # wrangler from the app folder — the same scripts used locally, so CI and a developer's
      # machine cannot drift apart.
      - name: Build & deploy
        run: pnpm --filter ${{ matrix.filter }} run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
