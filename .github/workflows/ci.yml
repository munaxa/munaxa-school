name: CI

on:
  # Run on PRs only. The post-merge commit on `main` is identical to the PR head
  # that already passed these checks, so re-running on `push: main` only burns
  # Actions minutes. The main ruleset requires these checks, so there is no
  # paths-ignore: a required check that a path filter never starts stays pending
  # forever, and a docs-only pull request could never merge.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

# Least privilege by default; a job that needs more declares it itself.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'

  node:
    name: Lint · Typecheck · Test · Build (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: munaxa
          POSTGRES_PASSWORD: munaxa_ci
          POSTGRES_DB: munaxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munaxa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Runtime/tests connect as the restricted, NOBYPASSRLS app role so RLS is enforced.
      DATABASE_URL: postgresql://munaxa_app:munaxa_app_dev@localhost:5432/munaxa?schema=public
      # Migrations connect as the privileged owner.
      DIRECT_DATABASE_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa?schema=public
      # psql rejects the Prisma-specific "schema" query param; use a clean libpq URI.
      PSQL_DIRECT_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      # The shared design system is published from munaxa-platform to GitHub Packages.
      # GITHUB_TOKEN is scoped to this repository and reads @munaxa/* only if each package has been
      # granted to it, so a fresh install (no pnpm store cache) is refused with ERR_PNPM_FETCH_403.
      # PLATFORM_PACKAGES_TOKEN (read:packages) is used when present, as in munaxa-work.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build internal packages
        run: pnpm turbo run build --filter=@school/domain --filter=@school/contracts --filter=@school/utils --filter=@school/brand

      - name: Apply database migrations
        run: pnpm --filter @school/api prisma:deploy

      - name: Provision restricted application role
        run: psql "$PSQL_DIRECT_URL" -v ON_ERROR_STOP=1 -f infra/postgres/app-role.sql

      - name: Seed database
        run: pnpm --filter @school/api db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests (DB / RLS)
        run: pnpm --filter @school/api test:e2e

      - name: Build
        run: pnpm build

  flutter:
    name: Analyze · Test (Flutter)
    runs-on: ubuntu-latest
    # The Flutter SDK download + analyze/test is the most expensive job. Only run it
    # when mobile code actually changed.
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Prepare platform folders
        working-directory: apps/mobile
        # `flutter create` also writes its template app (lib/main.dart, test/widget_test.dart) when
        # they are missing; they are not this app and do not build, so they go again.
        run: |
          flutter create --platforms=android,ios .
          git ls-files --error-unmatch lib/main.dart >/dev/null 2>&1 || rm -f lib/main.dart
          git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1 || rm -f test/widget_test.dart
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        # Infos (today: material.dart's deprecation in favour of material_ui) are reported, not
        # fatal; warnings and errors still fail.
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: apps/mobile
        run: flutter test

  # NOTE: munaxademo is a workspace member, built/typechecked/linted by the `node` job above
  # via turbo. The design system it renders is NOT built here — it is installed from
  # the registry as @munaxa/*, and munaxa-platform's own CI is what proves it good.

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      # Nothing migrates or deploys on a merge, and only Testing images (image-testing) publish on
      # one: every other such job is dispatched by hand and waits on the `production-gate` job and
      # an environment approval (scripts/deploy-gate.mjs).
      # The lint keeps a new or edited workflow from routing around it; the report shows on each
      # pull request whether each environment would currently let a run through.
      - name: Deployment gates · tests and workflow lint
        run: |
          node --test scripts/deploy-gate.test.mjs
          node scripts/deploy-gate.mjs lint
      # actionlint, built from its tagged module (Go verifies it against the checksum database).
      # Workflow syntax, expressions and contexts; the embedded shell is not linted here.
      - name: Workflow lint (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= -color
      - name: Deployment gates · environments
        run: |
          for target in production staging image-release image-testing; do
            node scripts/deploy-gate.mjs report-environment "$target"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every dependency, development tooling included, and a real gate: the former
      # `pnpm audit --prod || true` could not fail. A new high or critical advisory fails the
      # build; fix it by upgrading (docs/security/dependency-advisories.md lists the overrides).
      - name: Dependency audit
        run: pnpm audit --audit-level high
      # The gitleaks-action wrapper requires a paid licence for organisation-owned
      # repositories, which this became on the move to the munaxa org. The scanner
      # itself is MIT-licensed, so run the upstream binary directly and keep the check.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          # Authenticate the release lookup. Unauthenticated api.github.com calls are rate-limited
          # per runner IP, which Actions runners share, so this 403s at random — and because the
          # lookup gates the download, a 403 meant the repository was never scanned at all. Fall
          # back to a known-good version for the same reason: a lookup failure must not silently
          # turn the secret scan off.
          VERSION="$(curl -sSfL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name || true)"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="$GITLEAKS_FALLBACK_VERSION"
            echo "Release lookup failed; falling back to gitleaks ${VERSION}"
          fi
          echo "Using gitleaks ${VERSION}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_FALLBACK_VERSION: '8.30.0'

  # The images are built on every pull request, not only at release, verified and scanned. Never
  # pushed: publishing is publish-images-ecr.yml, dispatched by hand behind its gates.
  image:
    name: Images (api, migrate, admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Every base image is pinned by digest
        run: .github/scripts/check-pinned.sh apps/api/Dockerfile apps/admin/Dockerfile

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The token must be set on this step: `env=` reads the step's environment, and the Dockerfile
      # treats an absent secret as "no token" (required=false), which GitHub Packages answers 401.
      - name: Build api, migrate and admin
        env:
          GITHUB_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GITHUB_TOKEN" ] || { echo "::error::no package token reached this step"; exit 1; }
          docker buildx build --secret id=github_token,env=GITHUB_TOKEN -f apps/api/Dockerfile --target runtime -t munaxa-school-api:ci --load .
          docker buildx build --secret id=github_token,env=GITHUB_TOKEN -f apps/api/Dockerfile --target migrate -t munaxa-school-migrate:ci --load .
          docker buildx build --secret id=github_token,env=GITHUB_TOKEN -f apps/admin/Dockerfile --target runtime \
            --build-arg NEXT_PUBLIC_API_URL=https://school.test.munaxa.com/api/v1 --build-arg NEXT_PUBLIC_ENV=staging \
            -t munaxa-school-admin:ci --load .

      - name: Verify the images (zlib, packages, loaded libraries, Prisma, not root, no credential)
        run: |
          set -euo pipefail
          for target in api migrate admin; do
            .github/scripts/verify-image.sh "munaxa-school-$target:ci" "$target"
          done

      - name: Scan the images (SBOM, HIGH and CRITICAL fail)
        run: |
          set -euo pipefail
          status=0
          for target in api migrate admin; do
            .github/scripts/scan-image.sh "munaxa-school-$target:ci" "school-$target" image-reports || status=1
          done
          exit $status

      - name: Keep the SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-reports
          path: image-reports/
          if-no-files-found: warn
          retention-days: 90
