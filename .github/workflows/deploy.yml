name: Deploy

# GHCR images, database migrations and the service rollout for the Render-era stack. Nothing here
# runs on a merge: it is started by hand (Actions → Deploy → Run workflow) from `main`, with the
# target typed twice and each step ticked on its own. The `production-gate` job then proves that
# the chosen environment requires a reviewer's approval, and each of the three jobs below holds
# that environment, so each waits for its own approval: publishing images, migrating the database
# and rolling out are approved separately, and a step left unticked does not run. A failed gate or
# a refused approval stops the run before anything is pushed, migrated or deployed. See
# docs/ops/deployment-gates.md. The ECR images for AWS are published by publish-images-ecr.yml.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: Type the target environment again (staging or production)
        required: true
        type: string
      publish_images:
        description: Build and push the API and Admin images to GHCR
        type: boolean
        default: false
      migrate:
        description: Apply database migrations and the application role grants
        type: boolean
        default: false
      deploy:
        description: Roll out the services
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  production-gate:
    name: Production gate · approval required
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require a run started by hand, with its target confirmed
        run: node scripts/deploy-gate.mjs verify-dispatch "$TARGET"
        env:
          TARGET: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
      - name: Require a protected environment
        run: node scripts/deploy-gate.mjs verify-environment "$TARGET"
        env:
          TARGET: ${{ inputs.environment }}
          GITHUB_TOKEN: ${{ github.token }}

  build-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    needs: production-gate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compute image names
        id: meta
        run: |
          # GHCR requires a lowercase repository path.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the local daemon first, verified and scanned (HIGH/CRITICAL fail), and only then
      # pushed: an image that fails either never reaches GHCR. The same scripts as CI and the ECR
      # release (publish-images-ecr.yml).
      - name: Build API image (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          secrets: |
            github_token=${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/munaxa-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/munaxa-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build Admin image (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/admin/Dockerfile
          secrets: |
            github_token=${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/munaxa-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/munaxa-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      - name: Verify and scan before pushing
        env:
          REPO: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          .github/scripts/verify-image.sh "$REPO/munaxa-api:$SHA" api
          .github/scripts/verify-image.sh "$REPO/munaxa-admin:$SHA" admin
          .github/scripts/scan-image.sh "$REPO/munaxa-api:$SHA" school-api image-reports
          .github/scripts/scan-image.sh "$REPO/munaxa-admin:$SHA" school-admin image-reports

      - name: Keep the SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-reports-ghcr
          path: image-reports/
          if-no-files-found: warn
          retention-days: 400

      - name: Push
        env:
          REPO: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in munaxa-api munaxa-admin; do
            docker push -q "$REPO/$image:$SHA" >/dev/null
            docker push -q "$REPO/$image:latest" >/dev/null
            echo "pushed $(docker image inspect --format '{{index .RepoDigests 0}}' "$REPO/$image:$SHA")"
          done

  # Independent of build-images: the migration runs from this checkout, not from an image.
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: production-gate
    if: github.event_name == 'workflow_dispatch' && inputs.migrate
    environment: ${{ inputs.environment }}
    # Installing needs to pull @munaxa/* from GitHub Packages. The workflow-level
    # default is contents:read only, which authenticates but cannot download a
    # private package — the tarball comes back 403 while every public dependency
    # resolves fine. build-images escapes this via its packages:write.
    permissions:
      contents: read
      packages: read
    env:
      # Owner (privileged) connection for migrations; configured per GitHub environment.
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The URL is a secret, so nothing here can see which database it names. Before connecting,
      # the environment must declare it: DATABASE_ENVIRONMENT (its own name) and DATABASE_HOST
      # (the host the URL points at). Otherwise the job stops (docs/ops/deployment-gates.md).
      - name: Require the database this environment declares
        run: node scripts/deploy-gate.mjs verify-database "$TARGET"
        env:
          TARGET: ${{ inputs.environment }}
          DATABASE_ENVIRONMENT: ${{ vars.DATABASE_ENVIRONMENT }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.33.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: prisma migrate deploy
        run: |
          # SC-04 (11 Nov audit): this job runs only when the operator asked for a migration, so a
          # missing secret is a failure, never a green "skipped" run.
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::DIRECT_DATABASE_URL is not set for this environment; no migration was applied."
            exit 1
          fi
          pnpm --filter @school/api prisma:deploy
      # runtime-grants.sql, not app-role.sql: app-role.sql creates munaxa_app with the committed
      # local/CI password when the role is missing. Here a missing role stops the job instead; create
      # it by hand with its own password first (docs/deployment-staging.md step 4).
      - name: Re-apply restricted application role grants
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::DIRECT_DATABASE_URL is not set for this environment; grants were not applied."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/runtime-grants.sql

  # Run the migration first, in its own run, when a release needs one.
  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: production-gate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: ${{ inputs.environment }}
    steps:
      - name: Roll out images
        run: |
          # Environment-specific rollout. The images are published as:
          #   ghcr.io/<repo>/munaxa-api:${{ github.sha }}
          #   ghcr.io/<repo>/munaxa-admin:${{ github.sha }}
          # Wire ONE of the following per the hosting decision (08-deployment-architecture):
          #  - ECS:  aws ecs update-service --force-new-deployment (task def pinned to the sha tag)
          #  - K8s:  kubectl set image deploy/munaxa-api api=ghcr.io/...:${{ github.sha }}
          #  - VM:   ssh + docker compose pull && up -d (compose file pinned to the sha tag)
          # Health-gate the cutover on /api/v1/health/ready before shifting traffic.
          # SC-05 (11 Nov audit): nothing is rolled out yet, so a run that asked for a rollout must not
          # end green. Fails until a target above is wired.
          echo "::error::No rollout target is configured for this environment; nothing was deployed. The images are published (if requested) and ready."
          exit 1
