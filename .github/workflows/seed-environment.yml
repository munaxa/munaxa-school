name: Seed environment

# Bootstrap accounts for a freshly migrated environment. `prisma migrate deploy` creates the
# schema but no rows, so a new database has no tenant and no users and nobody can sign in —
# see docs/deployment-staging.md steps (c) and (d), which were previously manual.
#
# Deliberately manual: seeding writes real accounts, and the demo tenant ships with a password
# published in the README. Never wire this into the automatic deploy path.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: Type the target environment again (staging or production)
        required: true
        type: string
      demo_tenant:
        description: 'Also seed the demo tenant (admin@demo.example). Test data only — the password is public.'
        type: boolean
        default: false
      school_slug:
        description: 'Optional: add a school with this code (lowercase, digits, -). Plans and licences are set in Munaxa Control.'
        type: string
        default: ''
      school_name:
        description: 'The new school''s name (with school_slug)'
        type: string
        default: ''
      school_admin_email:
        description: 'Its first administrator, who signs in with Munaxa (with school_slug)'
        type: string
        default: ''

concurrency:
  group: seed-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-gate:
    name: Production gate · approval required
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require a run started by hand, with its target confirmed
        run: node scripts/deploy-gate.mjs verify-dispatch "$TARGET"
        env:
          TARGET: ${{ github.event.inputs.environment }}
          CONFIRM: ${{ github.event.inputs.confirm }}
      - name: Require a protected environment
        run: node scripts/deploy-gate.mjs verify-environment "$TARGET"
        env:
          TARGET: ${{ github.event.inputs.environment }}
          GITHUB_TOKEN: ${{ github.token }}

  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: production-gate
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      # Seeds write across tenants, so they use the OWNER connection, not the restricted
      # app role — the same secret the migrate job uses.
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before connecting: the environment must declare which database it is for
      # (docs/ops/deployment-gates.md).
      - name: Require the database this environment declares
        run: node scripts/deploy-gate.mjs verify-database "$TARGET"
        env:
          TARGET: ${{ github.event.inputs.environment }}
          DATABASE_ENVIRONMENT: ${{ vars.DATABASE_ENVIRONMENT }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}

      - name: Require the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DIRECT_DATABASE_URL is not set for the '${{ github.event.inputs.environment }}' environment. Nothing was seeded."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.33.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prisma generate
        run: pnpm --filter @school/api prisma:generate

      # The seed scripts import the permission/role baseline from @school/domain, so the
      # workspace packages have to be compiled first — same step, same filters as CI.
      - name: Build internal packages
        run: pnpm turbo run build --filter=@school/domain --filter=@school/contracts --filter=@school/utils

      # Global permission catalog — idempotent, safe to re-run.
      - name: Seed permission catalog
        run: pnpm --filter @school/api db:seed

      # A new school and its first administrator (no School password: staff sign in with Munaxa).
      # Inputs reach the script through the environment, never the shell command line.
      - name: Add a school
        if: ${{ github.event.inputs.school_slug != '' }}
        run: pnpm --filter @school/api school:provision
        env:
          APPLY: 'yes'
          SCHOOL_SLUG: ${{ github.event.inputs.school_slug }}
          SCHOOL_NAME: ${{ github.event.inputs.school_name }}
          ADMIN_EMAIL: ${{ github.event.inputs.school_admin_email }}

      - name: Seed demo tenant
        if: ${{ github.event.inputs.demo_tenant == 'true' }}
        run: pnpm --filter @school/api db:seed:demo

      - name: Summary
        run: |
          {
            echo "### Seeded \`${{ github.event.inputs.environment }}\`"
            echo
            echo "- Permission catalogue: applied (idempotent)"
            if [ "${{ github.event.inputs.demo_tenant }}" = "true" ]; then
              echo "- Demo tenant: \`demo\` / \`admin@demo.example\` — **change this password if the host is reachable**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
