name: Seed environment

# Bootstrap accounts for a freshly migrated environment. `prisma migrate deploy` creates the
# schema but no rows, so a new database has no tenant and no users and nobody can sign in —
# see docs/deployment-staging.md steps (c) and (d), which were previously manual.
#
# Deliberately manual: seeding writes real accounts, and the demo tenant ships with a password
# published in the README. Never wire this into the automatic deploy path.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      demo_tenant:
        description: 'Also seed the demo tenant (admin@demo.example). Test data only — the password is public.'
        type: boolean
        default: false

concurrency:
  group: seed-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      # Seeds write across tenants, so they use the OWNER connection, not the restricted
      # app role — the same secret the migrate job uses.
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      PLATFORM_OWNER_EMAIL: ${{ vars.PLATFORM_OWNER_EMAIL }}
      PLATFORM_OWNER_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
    steps:
      - name: Require the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DIRECT_DATABASE_URL is not set for the '${{ github.event.inputs.environment }}' environment. Nothing was seeded."
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prisma generate
        run: pnpm --filter @school/api prisma:generate

      # Global permission catalog — idempotent, safe to re-run.
      - name: Seed permission catalog
        run: pnpm --filter @school/api db:seed

      # Platform owner. PLATFORM_OWNER_PASSWORD falls back to the script's default when the
      # secret is unset, which is fine for a throwaway environment and not for a real one.
      - name: Seed platform owner
        run: pnpm --filter @school/api db:seed:platform-owner

      - name: Seed demo tenant
        if: ${{ github.event.inputs.demo_tenant == 'true' }}
        run: pnpm --filter @school/api db:seed:demo

      - name: Summary
        run: |
          {
            echo "### Seeded \`${{ github.event.inputs.environment }}\`"
            echo
            echo "- Permission catalogue: applied (idempotent)"
            echo "- Platform owner: \`${PLATFORM_OWNER_EMAIL:-owner@munaxa.com}\`"
            if [ "${{ github.event.inputs.demo_tenant }}" = "true" ]; then
              echo "- Demo tenant: \`demo\` / \`admin@demo.example\` — **change this password if the host is reachable**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
