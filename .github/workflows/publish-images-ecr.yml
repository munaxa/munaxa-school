# Publishing Munaxa School's images to Amazon ECR for the shared AWS stack (munaxa-platform
# infra/aws), so an ECS deployment pulls an artifact built and checked here, pinned by digest.
#
#   munaxa-school/api      apps/api/Dockerfile, target runtime
#   munaxa-school/migrate  apps/api/Dockerfile, target migrate (the release job)
#   munaxa-school/admin    apps/admin/Dockerfile, one build per environment (tags -nonprod, -prod)
#
# It replaces deploy.yml's GHCR publishing and CI-runner migrations, which cannot reach the
# stack's private database, once the AWS deployment is validated. The public demo (munaxademo,
# Cloudflare) is a separate application and is not built here.
#
# **Dispatched on a tag, and the tag names the commit.** Push a tag `image/<40-hex commit SHA>` on
# a commit that is on `main`, then run this workflow with "Use workflow from" set to that tag. It
# is dispatch-only, not tag-triggered, because this repository's deployment-gate lint
# (scripts/deploy-gate.mjs) admits a job with an environment only on dispatch, behind the
# `production-gate` job. The jobs that touch ECR run in the protected `image-release` environment and
# assume this repository's image publisher role through GitHub OIDC; the role's trust requires that
# environment and an image/* tag, and it may push only to this product's repositories. No registry
# credential exists.
#
# **No `latest`.** Two immutable tags per image (`<short>`, `sha-<full>`) and the digest, which is
# what the stack's tfvars name. Inert until the owner sets the repository variable
# AWS_IMAGE_PUBLISHER_ROLE_ARN (munaxa-platform infra/aws/README.md, gate G2).

name: Publish images to ECR

on:
  workflow_dispatch:

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  REGISTRY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  # The repository's deployment gate (docs/ops/deployment-gates.md): the image-release environment
  # must require a reviewer and admit only image/* tags, and this run must be on such a tag.
  production-gate:
    name: Production gate · approval required
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the target environment
        run: node scripts/deploy-gate.mjs verify-environment "$TARGET"
        env:
          TARGET: image-release
          GITHUB_TOKEN: ${{ github.token }}

  source:
    name: Resolve the source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Read the commit from the tag name
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="${REF_NAME#image/}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this workflow from an image/<sha> tag, not from $GITHUB_REF"; exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag must be image/<40-hex commit SHA>, got '$REF_NAME'"; exit 1
          fi
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "::error::tag $REF_NAME points at $GITHUB_SHA, not at the commit it names"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main (reviewed history)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }

  publish:
    name: ${{ matrix.repository }}${{ matrix.tag_suffix }}
    needs: [production-gate, source]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: image-release # required reviewer; the publisher role trusts only this subject
    permissions:
      contents: read
      packages: read # @munaxa/* from GitHub Packages, during the build only
      id-token: write # GitHub OIDC, for the image publisher role
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: munaxa-school/api
            dockerfile: apps/api/Dockerfile
            target: runtime
            build_args: ''
            tag_suffix: ''
          - repository: munaxa-school/migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            build_args: ''
            tag_suffix: ''
          # The admin compiles NEXT_PUBLIC_* into its bundle, so each environment has its own build,
          # served on the same host as the API (same origin).
          - repository: munaxa-school/admin
            dockerfile: apps/admin/Dockerfile
            target: runtime
            tag_suffix: '-nonprod'
            build_args: |
              NEXT_PUBLIC_API_URL=https://school.test.munaxa.com/api/v1
              NEXT_PUBLIC_ENV=staging
          - repository: munaxa-school/admin
            dockerfile: apps/admin/Dockerfile
            target: runtime
            tag_suffix: '-prod'
            build_args: |
              NEXT_PUBLIC_API_URL=https://school.munaxa.com/api/v1
              NEXT_PUBLIC_ENV=production
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
    steps:
      - name: Refuse to run before the publisher role exists
        env:
          ROLE: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_IMAGE_PUBLISHER_ROLE_ARN is not set (munaxa-platform infra/aws, gate G2)"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '229251310592'

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: false # a single-platform manifest, so the digest names the image
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.repository }}:${{ env.SHORT }}${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ matrix.repository }}:sha-${{ env.SHA }}${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The registry credential for @munaxa/* as a BuildKit secret, never a build argument.
          secrets: |
            github_token=${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify the image runs as non-root and carries no credential
        env:
          REF: ${{ env.REGISTRY }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${{ steps.build.outputs.digest }}" ] || { echo "::error::no digest was produced"; exit 1; }
          docker pull "$REF"
          user=$(docker run --rm --entrypoint sh "$REF" -c 'id -un')
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }
          if docker history --no-trunc --format '{{.CreatedBy}}' "$REF" | grep -qE 'ghp_|github_pat_|_authToken=[A-Za-z0-9]'; then
            echo "::error::a credential appears in image history"; exit 1
          fi
          if docker run --rm --entrypoint sh "$REF" -c 'find / -name ".npmrc" 2>/dev/null | xargs grep -l "_authToken=[A-Za-z0-9]" 2>/dev/null' | grep -q .; then
            echo "::error::an npmrc carrying a token is present in the image"; exit 1
          fi
          {
            echo "### ${{ matrix.repository }}${{ matrix.tag_suffix }}"
            echo "\`$REF\` from \`$SHA\`, runs as \`$user\`"
          } >> "$GITHUB_STEP_SUMMARY"
