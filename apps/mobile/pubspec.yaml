name: munaxa_mobile
description: Munaxa mobile apps (Parent / Student / Teacher) — School Operating System.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local storage (offline-first attendance queue — Phase 7)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2

  # Firebase (Auth + FCM — Phase 3 / 10)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6

  # i18n / RTL
  intl: ^0.20.0

  # Connectivity (offline-first attendance sync trigger)
  connectivity_plus: ^6.1.0

  # Opening external resource/document links
  url_launcher: ^6.3.1

  # Document vault upload (pick a file from device)
  file_picker: ^8.1.6

  # Observability
  sentry_flutter: ^8.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1
  # Native app-launcher icon generator. After the platform folders exist
  # (`flutter create`), run: `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.1

# Native launcher icons (home-screen / app drawer). The brand mark on the brand ink
# background for iOS + legacy Android; an adaptive (foreground + background)
# icon on Android. Sources live in assets/icon/.
flutter_launcher_icons:
  image_path: "assets/icon/ic_launcher.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#090B0C"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/munaxa-logo.png
    - assets/munaxa-logo-light.png
    - assets/munaxa-logo-dark.png
